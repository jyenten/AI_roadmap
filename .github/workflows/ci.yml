name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: rag_api_project

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"


      - name: Verify dependency lock consistency
        run: python -B scripts/check_dependency_lock.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-linux-py311.lock.txt
          python -m pip check

      - name: Run tests
        run: python -m pytest tests -q