name: Python Dependency Audit

on:
  pull_request:
  push:
    branches:
      - document-search-bm25
    paths:
      - "rag_api_project/requirements.txt"
      - ".github/workflows/pip-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      # Requirements are not pinned yet: this audits freshly resolved versions,
      # not the exact dependency versions installed on developer machines.
      - name: Audit requirements and transitive dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: rag_api_project/requirements.txt
